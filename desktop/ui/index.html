<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Blog Shorts</title>
  <link rel="stylesheet" href="studio.css">
  <script type="module" src="studio.js"></script>
</head>
<body>
  <main>
    <header>
      <div class="brand"><span class="mark" aria-hidden="true"><i></i></span>Blog Shorts</div>
      <h1>새 숏츠 만들기</h1>
      <p>블로그 글의 사진과 대사로 내레이션과 자막이 담긴 세로 영상을 만드세요.</p>
    </header>
    <form id="form">
      <fieldset id="inputs" disabled>
        <section class="group" aria-labelledby="post-heading">
          <h2 id="post-heading">원본 글</h2>
          <div class="card post">
            <label for="url">네이버 블로그 글 주소</label>
            <div class="url-field">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 13.8 4-4M8.2 15.8l-1 1a3.5 3.5 0 0 1-5-5l4-4a3.5 3.5 0 0 1 5 0m1.6 8.4a3.5 3.5 0 0 0 5 0l4-4a3.5 3.5 0 0 0-5-5l-1 1"/></svg>
              <input id="url" type="url" placeholder="https://blog.naver.com/아이디/글번호" spellcheck="false" required>
            </div>
          </div>
        </section>
        <section class="group" aria-labelledby="audio-heading">
          <h2 id="audio-heading">대본과 내레이션</h2>
          <div class="card">
            <div class="row"><div><strong>내레이션</strong><small>조금 높은 톤의 발랄한 여성 쇼호스트</small></div>
              <span>Gemini 3.8 Flash TTS</span>
            </div>
            <div class="row"><div><label for="key">DeepSeek API 키</label><small id="key-hint">대본과 장면 구성에 사용합니다.</small></div>
              <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="API 키 입력" aria-describedby="key-hint"></div>
            <div class="row" id="gemini-credentials"><div><label for="geminiKey">Gemini API 키</label><small>Google AI Studio에서 발급한 키</small></div>
              <input id="geminiKey" type="password" autocomplete="off" spellcheck="false" placeholder="API 키 입력"></div>
          </div>
          <p class="footnote">대본은 DeepSeek, 음성은 Google 사용량에 따라 과금됩니다. 입력한 키는 앱을 닫으면 지워집니다.</p>
        </section>
        <details class="card" id="settings">
          <summary>저장 위치와 실행 설정</summary>
          <div class="row"><label for="folder">MP4 저장 폴더</label><input id="folder" required spellcheck="false"></div>
          <div class="row"><label for="ffmpeg">FFmpeg 실행 경로</label><input id="ffmpeg" required spellcheck="false"></div>
        </details>
        <div class="actions"><span>세로 9:16 <b>·</b> MP4</span><button id="create" type="submit">숏츠 만들기</button></div>
      </fieldset>
    </form>
    <section class="card result" id="result" role="status" aria-live="polite" hidden>
      <h2 id="state"></h2><p id="message"></p>
      <button type="button" id="open" hidden>저장 폴더 열기</button>
    </section>
  </main>
</body>
</html>
